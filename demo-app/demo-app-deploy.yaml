apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "org1-ns1-5lhfb/my-vks-cluster"
        vault.hashicorp.com/auth-path: "auth/kubernetes-org1-ns1-5lhfb-my-vks-cluster"
        vault.hashicorp.com/agent-inject-secret-config.txt: "secret/data/org1-ns1-5lhfb/my-vks-cluster-db-creds1"
    spec:
      serviceAccountName: app-secret-sa
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
